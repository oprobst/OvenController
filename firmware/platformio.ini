; Oven controller firmware
; See specs/001-startup-status-menu/plan.md and research.md for the decisions behind this file.

[platformio]
default_envs = esp32_revdev

[env]
; C++-only flags (-std=gnu++17, -fno-exceptions, -fno-rtti) are added by scripts/cxx_flags.py
extra_scripts = pre:scripts/cxx_flags.py
build_flags =
    -Wall
    -Wextra
    -I include
build_unflags =
    -std=gnu++11
    -fexceptions
    -frtti
lib_ldf_mode = deep+
test_framework = unity
check_tool = cppcheck
check_skip_packages = yes
check_src_filters =
    +<src/>
    +<include/>
    +<lib/>
check_flags =
    cppcheck: --enable=warning,style,performance --inline-suppr --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=*:*.pio*
check_severity = medium, high

[env:esp32_revdev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    lovyan03/LovyanGFX@1.1.16
build_flags =
    ${env.build_flags}
    -DOVEN_BOARD_REV_DEV
test_filter = hil/*

; PCB REV A: ESP32-S3-WROOM-1U-N8 (8 MB flash, no PSRAM), native USB.
; See specs/002-controller-pcb/research.md (R3, R16).
[env:esp32s3_reva]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps =
    lovyan03/LovyanGFX@1.1.16
build_flags =
    ${env.build_flags}
    -DOVEN_BOARD_REV_A
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
test_filter = hil/*

[env:native]
platform = native
lib_ignore = hal_esp32
test_ignore = hil/*
